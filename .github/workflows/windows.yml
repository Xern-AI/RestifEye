name: Windows test build

# Builds, tests and smoke-tests the Windows app. The exe and zip are never
# published from this public repo: no Actions artifacts (anyone signed in can
# download those), no release files here, and no cache of build output. A
# zip goes only to a release on the private Xern-AI/restifeye-builds repo.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDS_REPO: Xern-AI/restifeye-builds
  KEEP_RELEASES: 10

jobs:
  windows:
    name: Analyze, test, build, smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same pin as ci.yml and release.yml. The cache holds the SDK and the
      # pub cache only, never anything built.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build windows --release

      # Starts the real app, leaves it running for 20 seconds, then requires
      # that it is still alive, that SQLite shipped inside the build, and that
      # its own log reached the end of startup with no FAIL or ERROR line.
      - name: Smoke test
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          if (-not (Get-ChildItem "$release\*sqlite3*.dll" -ErrorAction SilentlyContinue)) {
            throw "SQLite is not bundled in $release"
          }
          $data = Join-Path $env:APPDATA "RestifEye"
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue

          $app = Start-Process -FilePath "$release\RestifEye.exe" -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $app.HasExited

          $log = Get-ChildItem (Join-Path $data "logs") -Filter "restifeye-*.log" -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -Last 1
          Write-Host "----- RestifEye log -----"
          if ($log) { Get-Content $log.FullName } else { Write-Host "(no log file)" }
          Write-Host "-------------------------"

          if ($alive) { Stop-Process -Id $app.Id -Force }
          if (-not $alive) { throw "RestifEye exited within 20 seconds (exit code $($app.ExitCode))" }
          if (-not $log) { throw "RestifEye wrote no log" }
          $text = Get-Content $log.FullName -Raw
          if ($text -notmatch "startup complete") { throw "The log never reached 'startup complete'" }
          if ($text -match " (FAIL|ERROR) ") { throw "The log shows an adapter failure or an uncaught error" }
          if ($text -match "startup RestifEye 0\.0\.0") { throw "The app could not read its own version" }

      # The Microsoft Store package. Microsoft signs it on upload. An MSIX
      # version's last part must be 0 and every upload needs a higher version,
      # so the build number becomes the third part: 0.3.0+16 -> 0.3.16.0.
      - name: Store package
        shell: pwsh
        run: |
          $full = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $version, $build = $full.Split('+')
          $major, $minor, $null = $version.Split('.')
          $msixVersion = "$major.$minor.$build.0"
          dart run msix:create --store --build-windows false --version $msixVersion --output-path build\msix --output-name RestifEye
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path build\msix\RestifEye.msix)) { throw "No Store package was produced" }
          Write-Host "Store package version $msixVersion"

      # Installs the Store package the way Windows installs an app (signed
      # here with a throwaway certificate carrying the Store publisher name,
      # which never leaves this runner), runs it for 20 seconds, and requires
      # its log to show a Store build that started cleanly and asked the Store
      # for its licence (a sideloaded copy has none, so it stays unlocked).
      # This is the only place the Store-only code runs before the Store does.
      - name: Store package smoke test
        shell: pwsh
        run: |
          $publisher = 'CN=794EA849-0120-4E1B-822E-5576A7C84BA6'
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'ci-signing.pfx'
          $password = ConvertTo-SecureString -String 'ci-only' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' -Password $password | Out-Null

          $signed = Join-Path $env:RUNNER_TEMP 'RestifEye-ci-signed.msix'
          Copy-Item build\msix\RestifEye.msix $signed
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p ci-only $signed | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Signing the test copy failed" }

          Get-Process RestifEye -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force (Join-Path $env:APPDATA 'RestifEye') -ErrorAction SilentlyContinue
          Add-AppxPackage -Path $signed
          $package = Get-AppxPackage -Name 'XernAI.Restifeye'
          if (-not $package) { throw "The Store package did not install" }
          Start-Process "shell:AppsFolder\$($package.PackageFamilyName)!restifeye"
          Start-Sleep -Seconds 20
          $app = Get-Process RestifEye -ErrorAction SilentlyContinue

          $roots = @(
            (Join-Path $env:LOCALAPPDATA "Packages\$($package.PackageFamilyName)\LocalCache\Roaming\RestifEye\logs"),
            (Join-Path $env:APPDATA 'RestifEye\logs'))
          $log = $roots | Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Filter 'restifeye-*.log' } |
            Sort-Object LastWriteTime | Select-Object -Last 1
          Write-Host "----- RestifEye Store build log ($($log.FullName)) -----"
          if ($log) { Get-Content $log.FullName | Select-Object -Last 40 } else { Write-Host "(no log file)" }
          Write-Host "-------------------------"

          # Read before uninstalling: removing the package deletes its data.
          $text = if ($log) { (Get-Content $log.FullName | Select-Object -Last 40) -join "`n" } else { '' }
          if ($app) { $app | Stop-Process -Force }
          Remove-AppxPackage -Package $package.PackageFullName
          if (-not $app) { throw "The Store build was not running after 20 seconds" }
          if (-not $log) { throw "The Store build wrote no log" }
          if ($text -notmatch "Store build") { throw "The package did not run as a Store build" }
          # A sideloaded copy has no Store SKU, so it must not be locked.
          if ($text -notmatch "licence unlimited") { throw "The Store licence check did not answer as expected" }
          if ($text -notmatch "startup complete") { throw "The log never reached 'startup complete'" }
          if ($text -match " (FAIL|ERROR) ") { throw "The Store build log shows a failure" }

      - name: Package
        id: package
        if: github.repository == 'Xern-AI/RestifEye' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $full = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $version, $build = $full.Split('+')
          $sha = "${{ github.sha }}".Substring(0, 7)
          $zip = "RestifEye-$version-$sha-windows-x64.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          $msix = "RestifEye-$version-$sha-store.msix"
          Copy-Item build\msix\RestifEye.msix $msix
          "msix=$msix" >> $env:GITHUB_OUTPUT
          "tag=windows-v$version-b$build-r${{ github.run_number }}-$sha" >> $env:GITHUB_OUTPUT
          "title=RestifEye $full ($sha) for Windows" >> $env:GITHUB_OUTPUT

      # The token reaches only these two steps. gh's own output (which
      # includes the release URL) is discarded; only the tag is printed.
      - name: Deliver to the private builds repo
        if: steps.package.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINDOWS_BUILDS_TOKEN }}
          ZIP: ${{ steps.package.outputs.zip }}
          MSIX: ${{ steps.package.outputs.msix }}
          TAG: ${{ steps.package.outputs.tag }}
          TITLE: ${{ steps.package.outputs.title }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if (-not $env:GH_TOKEN) { throw "The WINDOWS_BUILDS_TOKEN secret is not set in this repo" }
          $notes = "Test build from branch $env:BRANCH, commit ${{ github.sha }}.`n`nZip: unzip, then run RestifEye.exe (SmartScreen: More info, then Run anyway). Logs: %APPDATA%\RestifEye\logs`n`n.msix: the Microsoft Store package, for uploading in Partner Center only (it is unsigned until the Store signs it)."
          gh release create $env:TAG $env:ZIP $env:MSIX --repo $env:BUILDS_REPO --title $env:TITLE --notes $notes --prerelease | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not create the release" }
          Write-Host "Delivered $env:ZIP as release $env:TAG in the private builds repo."

      - name: Keep only the newest test releases
        if: steps.package.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINDOWS_BUILDS_TOKEN }}
        run: |
          $releases = gh release list --repo $env:BUILDS_REPO --limit 200 --json tagName,createdAt | ConvertFrom-Json
          $old = $releases | Where-Object { $_.tagName -like 'windows-*' } |
            Sort-Object createdAt -Descending | Select-Object -Skip ([int]$env:KEEP_RELEASES)
          foreach ($release in $old) {
            gh release delete $release.tagName --repo $env:BUILDS_REPO --yes --cleanup-tag | Out-Null
            Write-Host "Removed old test release $($release.tagName)"
          }
